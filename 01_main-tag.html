<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인태그</title>
  </head>
  <body>
    <!-- 제목 h1 ~ h6 -->
    <h1>헤드라인 1</h1>
    <!-- h1이 가장 큰 것 -->
    <h2>헤드라인 2</h2>
    <h3>헤드라인 3</h3>
    <!-- 여기까지만... 왜? 마크다운 -> h3까지만 대응해서 지원 -->
    <!-- #, ##, ### -->
    <h4>헤드라인 4</h4>
    <h5>헤드라인 5</h5>
    <h6>헤드라인 6</h6>
    <!-- 시각적 차이 뿐만 아니라 검색엔진, AI는 이 h들을 우선적으로 검색 -->
    <!-- 줄바꿈 br -->
    <!-- 텍스트가 들어가도 '문단'을 구분하는 태그 안에 있는게 아니면 붙여서 표현 -->
    <!-- parsing 그 역할만 하게 하고 화면에 표시 하지 x -->
    <p>문단을 의미</p>
    <!-- shift enter : 문단 내 줄바꿈 -->
    <p>확실히 구분 되기 위해 위아래 여백으로 구분</p>
    <p>확실히 구분 되기 위해 위아래 여백으로 구분</p>
    <p>
      p태그는 <br />
      과 <br />
      혼용 가능
    </p>
    <!-- 엔터티 -->
    <p>
      p태그는 &lt; 과 /&gt;과 <br />
      혼용 가능
    </p>
    <p>태그의 경우에는 일반 문장에서 넣으면 요소 취급</p>
    <!-- 엔터티를 통해서 표현, js를 통해서 표현 -->
    <!-- 요새는 html 태그를 어떻게 배우는가? 여러분들이 만들고 싶은 화면이 생김 -> AI를 통해서 생성 -> 대표적으로 쓰는 태그로 생성 -> 그 코드를 읽음 -> 내가 쓰고 싶은 태그를 발견/저장 -->
    <!-- 가등하면 화면을 꾸미는 태그들은 덜 쓰고, css에게 맡기자 -->
    <p>
      strong
      <strong>강조</strong>
      볼드처리
      <!-- 딱히 의미론적으로는 기능이 없다... -->
      <i>이탤릭체</i>
      <em>이탤릭체</em>
      <span style="font-style: italic">이탈릭체</span>
      <!-- em, b, ...? -->
      <!-- css3를 쓴다 -->
      <br />
      <br />
      <br />

      <!-- 목록 (순서(order)가 있는 목록, 순서가 없는 목록(unordered)) -->
      <li>세수하기</li>
      <li>양치하기</li>
      <li>커피 마시기</li>
      <!-- shift 방향키로 범위 지정, alt 방향키 지정한 범위 이동, alt+shift 방향키 지정한 범위 복사 -->
      <ul>
        <li>로또 사기</li>
        <li>주식 가격보기</li>
        <li>연금복권 사기</li>
      </ul>
      <!--  . 숫자 같은 디자인은 -> 태그로 바꿀 수도 있으나 요새는 css로 바꿈 -->
    </p>
    <!-- 링크: HTML -> HyperText Markup Lang... -->
    <!-- href / hypertext reference -->
    <a href="https://google.com">링크</a>
    <a href="https://google.com" target="_blank">링크</a>
    <!-- <br>, <img>, <br />, <img /> -->
    <!-- {}, 객체, 변수, 리터럴... -->
    <!-- img -->
    <br>
    <img src="https://picsum.photos/400/200" alt="랜덤이미지" title="커서를 올리면"> <br>
    <!-- alternative text - alt -->
    <img src="주소인척" alt="깨진 이미지">
    <!-- <t> 닫힌 태그 -->
    <!-- <t> <t /> 열린 태그 -->
  </body>
</html>

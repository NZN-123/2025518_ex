<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 실습</title>
  </head>
  <body>
    <img src="https://picsum.photos/400/200" />
    <h1>회원 가입 양식</h1>
    <!-- 기본적인 인풋 -->
    <h2>그냥 인풋</h2>
    <input name="username1" type="text" />
    <button>제출</button>
    <h2>폼 인풋</h2>
    <!-- 주소창에 데이터를 전달하는 방식: get -->
    <form action="https://search.naver.com/search.naver" method="get">
      <!-- 나 자신 페이지로 감 -->
      <!-- form으로 묶으면 하위 Input에서 enter치면 제출처리(혹은 버튼 누르면) -->
      <!-- input에 name을 안 붙여주면 주소창을 통해 전달 X -->
      <label for="username2">유저이름: </label>
      <input name="username2" id="username2" type="text" /> <br />
      <label for="username3">
        유저이름: <input name="username3" type="text" /> <br />
      </label>
      <label for="username2">비밀번호: </label>
      <input
        name="password"
        id="password"
        type="password"
        placeholder="암호를 입력해주세요."
      />
      <br />
      <p>암호를 입력해주세요</p>
      <hr />
      <!-- 큰 text. input 여러줄 -->
      <textarea name="lonh text" id=""></textarea>
      <input type="radio" name="gender" /> 남성
      <input type="radio" name="gender" /> 여성
      <select name="" id="">
        <option value="">서울</option>
        <option value="">부산</option>
        <option value="">대전</option>
        <input type="checkbox" name="hobby" value="1" />
        취미1
        <input type="checkbox" name="hobby" value="2" />
        취미2
        <input type="color" />
        <input type="date" />
        <!-- 둘이 실질적으로 같은 -->
        <input type="button" value="버튼" />
        <input type="submit" value="제출" />
      </select>
      <button>제출</button>
    </form>
  </body>
</html>
